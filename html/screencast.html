<!doctype html>
<html>
  <head>
    <style>
      #content {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
      }
      #currentUrl {
        margin: 1rem 2rem 0;
        font: 14px sans-serif;
      }
      #currentUrl a {
        word-break: break-all;
      }
      #content img {
        width: 640px;
        height: 480px;
        margin: 2rem;
      }
    </style>
    <script>
      const ws = new WebSocket(
        window.location.href.replace("http", "ws") + "ws",
      );
      ws.addEventListener("message", (event) => handleMessage(event.data));

      const unusedElems = [];

      function handleMessage(resp) {
        resp = JSON.parse(resp);

        switch (resp.msg) {
          case "init":
            if (resp.width && resp.height) {
              try {
                const contentImgRule = Array.from(self.document.styleSheets[0].cssRules).find((rule) => rule.selectorText === "#content img");
                if (contentImgRule) {
                  contentImgRule.style.width = resp.width + "px";
                  contentImgRule.style.height = resp.height + "px";
                }
              } catch (e) {
                console.log("Error adjusting stylesheet: ", e);
              }
            }
            break;

          case "screencast":
            setCurrentUrl(resp.url);
            img = createImage(resp.id);
            if (resp.data) {
              setImageData(img, resp.data);
            }
            break;

          case "close":
            img = unuseImage(resp.id);
            break;
        }
      }

      function setImageData(img, data) {
        //img.style.display = "";
        img.src = "data:image/png;base64," + data;
      }

      function setCurrentUrl(url) {
        const elem = document.getElementById("currentUrl");
        if (!elem) {
          return;
        }
        elem.replaceChildren();
        if (!url) {
          return;
        }
        const link = document.createElement("a");
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = url;
        elem.appendChild(link);
      }

      function createImage(id) {
        let elem = document.getElementById(id);
        if (elem) {
          return elem;
        }

        if (unusedElems.length) {
          elem = unusedElems.shift();
          elem.setAttribute("id", id);
          return elem;
        }

        elem = document.createElement("img");
        elem.setAttribute("id", id);
        document.getElementById("content").appendChild(elem);
        return elem;
      }

      function unuseImage(id) {
        const elem = document.getElementById(id);
        if (!elem) {
          return;
        }
        //elem.style.display = "none";
        unusedElems.push(elem);
      }
    </script>
    <head>
      <body>
        <div id="currentUrl"></div>
        <div id="content"></div>
      </body>
    </head>
  </head>
</html>
